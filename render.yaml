services:
  # Main AntPro website
  - type: web
    name: antpro-web
    runtime: node
    plan: free
    buildCommand: "echo 'static node app — no build'"
    startCommand: "node server.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FIREBASE_DATABASE_URL
        sync: false
      # Same service-account JSON used by the scraper; required for durable user writes.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

  # Live cricket scraper → Firebase (24/7 worker)
  - type: worker
    name: antpro-scraper
    runtime: python
    plan: free
    rootDir: scraper
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cricket_scraper.py"
    envVars:
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: POLL_INTERVAL
        value: "5"
